name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        # 填了就按这个名字建标签、发正式 Release；留空仍走滚动预发布 ci
        description: '正式 Release 的 tag（形如 v1.0.1，须以 v 开头）；留空 = 只发滚动预发布 ci'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # 创建 Release（含手动打标签）与滚动预发布 tag 需要

# 同一 ref 的并发运行串行排队（不取消在途）：两个运行同时「补传缺失资产」会重复 create/upload
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 可选签名：在仓库 Secrets 里配置这 4 项后，release 包自动用你的 keystore 签名；
      # 未配置时 release 输出未签名包（构建仍然通过），debug 包始终可直接安装。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 该 action 默认 packages 含旧的 tools 包，而 Google 自 2026-09-15 起不再提供它
          # （sdkmanager tools 报 Failed to find package 'tools'）；只装 platform-tools
          packages: 'platform-tools'

      - name: Install Android SDK components
        # 新版 SDK 版本号形如 37.0（Android 17）；包名若有变动，AGP 也会自动补装
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platforms;android-37.0" || echo "platform package renamed; AGP will auto-download it"

      - name: Use the official Gradle distribution in CI
        # 仓库里的 wrapper 指向国内腾讯镜像（本地加速用），CI 走官方源更稳
        run: sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$HOME/.gomoku-watch"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.gomoku-watch/gomoku-watch.jks"
          cat > "$HOME/.gomoku-watch/keystore.properties" <<EOF
          storeFile=$HOME/.gomoku-watch/gomoku-watch.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Resolve app version from the release tag
        # 版本号的唯一来源是发布 tag：推 v* 标签或手动触发填了 tag 时，按 major*10000+minor*100+patch
        # 推出 versionCode（保证后续 tag 单调递增，否则 Android 装不上），versionName 取去掉 v 的全名。
        # 没有 tag（日常 push/PR、手动滚动构建）时留空，用 app/build.gradle.kts 里的默认值。
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            echo "本次运行没有发布 tag：沿用仓库内默认版本号"
            exit 0
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 须以 v 开头（例如 v1.0.1），否则与 push tag 的发布路径不一致"; exit 1 ;;
          esac
          NAME="${TAG#v}"
          CORE="${NAME%%-*}"
          CORE="${CORE%%+*}"
          IFS=. read -r MA MI PA <<< "$CORE"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          for n in "$MA" "$MI" "$PA"; do
            if ! [[ "$n" =~ ^[0-9]+$ ]]; then
              echo "::error::tag「$TAG」的版本段必须是数字（形如 v1.0.1）"
              exit 1
            fi
          done
          if [ "$((10#$MI))" -gt 99 ] || [ "$((10#$PA))" -gt 99 ]; then
            echo "::error::minor/patch 必须 ≤ 99，否则 versionCode 会跟更高版本撞号"
            exit 1
          fi
          CODE=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))
          {
            echo "app_version_name=$NAME"
            echo "app_version_code=$CODE"
            echo "version_args=-PappVersionName=$NAME -PappVersionCode=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "发布版本：$NAME（versionCode $CODE）"

      - name: Verify weights manifest matches repo files
        # EngineWeights.kt 钉死了每个权重的大小与 SHA-256（应用按它校验下载结果）。
        # 仓库里的权重变了而清单没跟上时，发出的 APK 会永远校验失败——在这里提前拦住。
        # 两个方向都查：清单里的文件必须存在且匹配；assets 里的 .bin.lz4 也必须都在清单中
        # （漏进清单的权重不会被打包排除/下载管理覆盖，悄无声息地打进 APK）。
        run: |
          KTS=app/src/main/java/com/qwara/gomoku/engine/EngineWeights.kt
          ASSETS=app/src/main/assets/engine/common
          for name in $(grep -oP '"\K[a-z0-9_]+\.bin\.lz4(?=")' $KTS | sort -u); do
            EXPECT=$(grep -A3 "\"$name\"" $KTS | grep -oP '"\K[0-9a-f]{64}(?=")')
            EXPECT_SIZE=$(grep -A3 "\"$name\"" $KTS | grep -oP '^\s*\K[0-9]+(?=L,)')
            ACTUAL=$(sha256sum "$ASSETS/$name" | cut -d' ' -f1)
            ACTUAL_SIZE=$(stat -c %s "$ASSETS/$name")
            echo "$name: manifest=$EXPECT actual=$ACTUAL size=$ACTUAL_SIZE/$EXPECT_SIZE"
            test "$EXPECT" = "$ACTUAL" || { echo "::error::权重 $name 的 SHA-256 与 EngineWeights.kt 清单不一致"; exit 1; }
            test "$EXPECT_SIZE" = "$ACTUAL_SIZE" || { echo "::error::权重 $name 的 size 与 EngineWeights.kt 清单不一致"; exit 1; }
          done
          for f in "$ASSETS"/*.bin.lz4; do
            base=$(basename "$f")
            grep -q "\"$base\"" $KTS || { echo "::error::$base 在 assets 里但不在 EngineWeights.kt 清单中"; exit 1; }
          done

      - name: Publish engine weights release
        # 权重运行时下载的宿主：固定 tag（EngineWeights.kt 的 RELEASE_TAG）的 prerelease。
        # Release 已存在时只补缺失资产，绝不覆盖——旧版本 APK 按 SHA-256 校验，字节必须不变；
        # 换权重请连 RELEASE_TAG 一起换（engine-weights-v2 …），老版本继续下旧 tag。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KTS=app/src/main/java/com/qwara/gomoku/engine/EngineWeights.kt
          TAG=$(grep -oP 'RELEASE_TAG = "\K[^"]+' $KTS)
          ASSETS=app/src/main/assets/engine/common
          FILES=$(grep -oP '"\K[a-z0-9_]+\.bin\.lz4(?=")' $KTS | sort -u)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "创建权重 Release $TAG"
            (cd $ASSETS && gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "引擎权重 $TAG" \
              --notes "Rapfi 引擎 NNUE 权重，应用首次使用引擎功能时按需下载。不要改动本 Release 的资产（老版本 APK 按 SHA-256 校验）；换权重请改用新 tag。" \
              $FILES)
          else
            EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for f in $FILES; do
              if ! grep -qx "$f" <<< "$EXISTING"; then
                echo "补传缺失资产 $f"
                (cd $ASSETS && gh release upload "$TAG" "$f")
              fi
            done
          fi

      - name: Unit tests
        env:
          VERSION_ARGS: ${{ steps.version.outputs.version_args }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace $VERSION_ARGS

      - name: Build APKs
        env:
          VERSION_ARGS: ${{ steps.version.outputs.version_args }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace $VERSION_ARGS

      - name: Verify optimized artifacts
        # 防退化校验：
        # ① release 包必须合并了应用自有的 AOT baseline profile 规则（来自
        #    app/src/main/baseline-prof.txt + proguard 的 -keepnames；被移除或失效时
        #    规则数会从 ~1400 掉到 ~20，只剩 androidx 库自带的部分）。
        # ② arm64 librapfi.so 必须是仓库提交的 PGO+ThinLTO 优化版（见 AGENTS.md 的重建
        #    配方）。用原版或其他构建覆盖提交时会因尺寸不同而失败；
        #    本地重编引擎后记得同步更新这里的预期字节数。
        # ③ 发布路径上（有 tag）：包内报告的版本必须等于 tag 推出的版本，防止发出名不对版的包。
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version_name }}
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*universal*release*.apk)
          RULES=$(grep -c "qwara/gomoku" app/build/intermediates/combined_art_profile/release/compileReleaseArtProfile/baseline-prof.txt || true)
          LIB=$(unzip -l "$RELEASE_APK" | awk '/arm64-v8a\/librapfi.so/{print $1}')
          LIB7=$(unzip -l "$RELEASE_APK" | awk '/armeabi-v7a\/librapfi.so/{print $1}')
          echo "app profile rules=$RULES, arm64 librapfi.so bytes=$LIB, v7a bytes=$LIB7"
          test "${RULES:-0}" -ge 1000 || { echo "::error::release APK 的 baseline profile 缺少应用自有规则（预期 ≥1000）"; exit 1; }
          test "$LIB" = "2487912" || { echo "::error::arm64 librapfi.so 不是提交的 PGO+ThinLTO 优化版（预期 2487912 字节）"; exit 1; }
          test "$LIB7" = "1853696" || { echo "::error::armeabi-v7a librapfi.so 不是提交的 NEON+PGO 优化版（预期 1853696 字节）"; exit 1; }
          # 大权重不打进 APK（ignoreAssetsPattern，见 app/build.gradle.kts）：失效时在这里拦住，
          # 而不是等发布后才看到包变胖；config.toml 与 model210901.bin 必须仍在（引擎启动要读）
          if unzip -l "$RELEASE_APK" | grep -q 'assets/engine/common/.*\.bin\.lz4'; then
            echo "::error::release APK 不应包含 .bin.lz4 权重（应运行时下载）"; exit 1
          fi
          unzip -l "$RELEASE_APK" | grep -q 'assets/engine/common/config.toml' || { echo "::error::release APK 缺少 config.toml"; exit 1; }
          unzip -l "$RELEASE_APK" | grep -q 'assets/engine/common/model210901.bin' || { echo "::error::release APK 缺少 model210901.bin"; exit 1; }
          if [ -n "$EXPECTED_VERSION" ]; then
            # 直接读 APK 清单（而不是 AGP 的 output-metadata.json），验的就是真正发出去的那个包
            AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
            APK_VERSION=$("$AAPT2" dump badging "$RELEASE_APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
            echo "tag 版本=$EXPECTED_VERSION, 包内版本=$APK_VERSION"
            test "$APK_VERSION" = "$EXPECTED_VERSION" || { echo "::error::APK 内版本($APK_VERSION)与 tag 版本($EXPECTED_VERSION)不一致"; exit 1; }
          fi

      - name: Collect APKs
        # release：universal 全量包 + 三个单 ABI 包；debug：只收 universal 包供真机调试
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*release*.apk artifacts/
          cp app/build/outputs/apk/debug/*universal*debug*.apk artifacts/gomoku-watch-debug.apk
          ls -la artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: gomoku-watch-apks
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.apk
          generate_release_notes: true

      - name: Publish the official GitHub Release (manual runs with a tag)
        # 手动触发且填了 tag：在本次提交上建标签、发正式 Release（不再发滚动预发布）
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # 经 env 传入而非直接插值进脚本，避免输入被当成 shell 代码执行
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::tag 须以 v 开头（与 push tag 的发布路径一致，例如 v1.0.1）"; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # 重跑（或修完问题再来一次）时替换同名 Release 里的产物，不新建
            echo "Release $RELEASE_TAG 已存在：替换其中的 APK"
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              artifacts/*
          fi

      - name: Publish rolling CI prerelease (manual runs without a tag)
        # 手动触发且没填 tag：发布到滚动预发布 tag `ci`，每次用最新构建整体替换
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci --yes --cleanup-tag || true
          gh release create ci --prerelease \
            --title "CI 最新构建（main）" \
            --notes "main 分支手动触发的最新自动构建，每次手动运行整体替换。五种产物内核完全相同，按设备 ABI 任选其一：32 位手表（Wear 4100/Wear 2500 等大多数老表）选 armeabi-v7a，64 位手表选 arm64-v8a，不确定就选 universal 全量包；debug 包仅供真机调试。" \
            artifacts/*
